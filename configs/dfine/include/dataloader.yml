
train_dataloader:
  dataset:
    transforms:
      ops:
        # Serve-shape first: production frames pass through the sign's ~1147px
        # downscale + JPEG (q 85-100) before the model ever sees them; training
        # frames are pristine 4K captures. Degrade-and-restore (geometry
        # untouched) so the model trains on serve-realistic detail. No-op for
        # images already <= long_dim; kill-switch TRAIN_SERVE_SHAPE=0.
        - {type: RandomServeShape, long_dim: 1147, q_min: 85, q_max: 100, p: 1.0}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 72 # epoch in [71, ~) stop `ops`
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']

  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: 3
    stop_epoch: 72 # epoch in [72, ~) stop `multiscales`

  shuffle: True
  total_batch_size: 32 # total batch size equals to 32 (4 * 8)
  num_workers: 2
  pin_memory: True
  prefetch_factor: 2


val_dataloader:
  dataset:
    transforms:
      ops:
        # Deterministic serve-shape (fixed q) so val mAP measures the model under
        # the conditions production actually serves — not pristine 4K detail.
        - {type: RandomServeShape, long_dim: 1147, q: 93, deterministic: True}
        - {type: Resize, size: [640, 640], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  # shuffle=True so the `max_val_images` cap (set from the trainer via -u) samples a
  # different random subset each epoch. Without shuffle the cap would always evaluate
  # the same first-N images of the val split
  shuffle: True
  total_batch_size: 64
  num_workers: 1
  pin_memory: True
  persistent_workers: False
  prefetch_factor: 2
